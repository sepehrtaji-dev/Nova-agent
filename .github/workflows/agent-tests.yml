name: Nova agent tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run agent logic tests
        run: python -m unittest tests/test_agent_routing.py tests/test_verifier.py
