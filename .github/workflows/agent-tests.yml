name: Nova agent tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python sources
        run: python -m compileall -q agent tools memory model ui main.py App.py

      - name: Install lightweight runtime dependency
        run: python -m pip install --disable-pip-version-check ollama textual prompt_toolkit

      - name: Smoke-test both terminal UI front ends
        run: python -c "from ui.textual_app import NovaTextualApp; from ui.prompt_cli import main; print('UI imports OK')"

      - name: Run lightweight agent regression tests
        run: >
          python -m unittest
          tests/test_agent_routing.py
          tests/test_model_intent_classification.py
          tests/test_verifier.py
          tests/test_core.py
          tests/test_math_parser.py
          tests/test_memory.py
          tests/test_desktop_app_resolution.py
          tests/test_git_tool.py
          tests/test_filesystem_security.py
          tests/test_terminal_security.py
          tests/test_self_knowledge.py
          tests/test_diagnostics.py
          tests/test_introspection.py
          tests/test_episodic_memory.py
          tests/test_self_reflection.py
