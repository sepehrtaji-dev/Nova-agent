name: Nova agent tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python sources
        run: python -m compileall -q agent tools memory model ui main.py App.py

      - name: Install lightweight runtime and desktop test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt PySide6

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Smoke-test Figma desktop shell (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_figma_desktop_shell -v

      - name: Smoke-test both terminal UI front ends
        run: python -c "from ui.textual_app import NovaTextualApp; from ui.prompt_cli import main; print('UI imports OK')"

      - name: Run all lightweight agent regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build the Docker image
        run: docker build --tag nova-agent:test .
