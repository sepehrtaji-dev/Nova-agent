name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach Nova.exe to (empty = build artifact only)"
        required: false
        default: ""
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Nova.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PySide6-Essentials pillow pyautogui pyinstaller tzdata

      - name: Convert logo to .ico
        shell: bash
        run: |
          python -c "from PIL import Image; im = Image.open('assets/nova-logo.png').convert('RGBA'); im.save('assets/nova-logo.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          ls -la assets/

      - name: Build Nova.exe
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile \
            --name Nova \
            --icon assets/nova-logo.ico \
            --add-data "assets;assets" \
            --add-data "config/tools.json;config" \
            --hidden-import PySide6.QtSvg \
            --hidden-import tools.web \
            --hidden-import tools.filesystem \
            --hidden-import tools.terminal \
            --hidden-import tools.git \
            --hidden-import tools.github \
            --hidden-import tools.desktop \
            --hidden-import tools.image_gen \
            --hidden-import integrations.noviqx.registry_tools \
            --collect-all textual \
            --collect-all markdown \
            --collect-all pymdownx \
            --collect-submodules agent \
            --collect-submodules api \
            --collect-submodules config \
            --collect-submodules integrations \
            --collect-submodules memory \
            --collect-submodules model \
            --collect-submodules sandbox \
            --collect-submodules storage \
            --collect-submodules tools \
            App.py
          ls -la dist/

      # Fail the build loudly if the bundle ever regresses: the manifest is a
      # data file (lives in the CArchive) and the tool modules live in the
      # embedded PYZ, so both are checked explicitly.
      - name: Verify bundled tool manifest and modules
        shell: bash
        run: |
          pyi-archive_viewer -r -b dist/Nova.exe > build-toc.txt
          grep -q "config/tools.json" build-toc.txt || { echo "FATAL: config/tools.json is NOT bundled"; exit 1; }
          for mod in tools.web tools.filesystem tools.terminal tools.git tools.github tools.desktop integrations.noviqx.registry_tools; do
            grep -q " ${mod}\$" build-toc.txt || { echo "FATAL: ${mod} is NOT bundled"; exit 1; }
          done
          echo "tool manifest and all tool modules are bundled"

      # Why the explicit list above: tools are instantiated through
      # importlib.import_module() with names read from config/tools.json, so
      # static analysis never sees them, and --collect-submodules silently
      # no-ops for first-party packages. Without --add-data for the manifest
      # and these hidden imports, the packaged app started with an empty tool
      # registry and answered everything with "No tools are enabled for this
      # session." pyautogui ships the desktop tool out of the box.

      # ── Code signing (optional) ──────────────────────────────────────────
      # Option A — Azure Artifact Signing (~$9.99/mo, instant SmartScreen trust):
      #   Add repo secrets AZURE_TENANT_ID, AZURE_CLIENT_ID,
      #   AZURE_CLIENT_SECRET, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE,
      #   then uncomment this step:
      # - name: Sign Nova.exe (Azure Artifact Signing)
      #   uses: azure/trusted-signing-action@v0
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      #     signing-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
      #     files-folder: dist
      #     files-folder-filter: exe
      #
      # Option B — SignPath Foundation (FREE for open source, signpath.org):
      #   Apply, connect their GitHub App, then wire their signing step here.
      #   The private key never leaves their HSM — nothing to protect locally.

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum Nova.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-windows-exe
          path: |
            dist/Nova.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach Nova.exe to release
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        shell: bash
        run: |
          TAG="${TAG_NAME}"
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac
          echo "resolved tag: $TAG"
          if [ -n "$TAG" ] && [ "$TAG" != "vmain" ]; then
            gh release upload "$TAG" dist/Nova.exe dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
            echo "attached Nova.exe + SHA256SUMS.txt to release $TAG"
          else
            echo "no tag to attach to, skipping"
          fi
